<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Конструктор баннеров</title>
<style>
:root{--bg:#f3f4f1;--surface:#fff;--fg:#14170f;--muted:#5d6455;--line:#dcdfd5;--accent:#c9a200;--accent-ink:#1a1600;--err:#c0392b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f110c;--surface:#181b14;--fg:#eceee6;--muted:#9aa190;--line:#2c3126;--accent:#e8c21a;--err:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;margin:0}
h1 span{color:var(--accent)}
p{margin:0;color:var(--muted)}
label{font-weight:500;font-size:14px}
input[type=password]{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.remember{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
button{font:inherit;font-weight:600;padding:11px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.err{color:var(--err);font-size:14px;min-height:1.2em}
</style>
</head>

  <div>
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
  </div>
  <label class="remember"><input id="remember" type="checkbox" checked> Запомнить на этом устройстве</label>
  <div class="err" id="err" role="alert"></div>
  <button type="submit" id="go">Войти</button>
</form>

<script>
(async () => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const salt = b64(P.salt), iv = b64(P.iv), data = b64(P.data);
  const KEY = "banner-key-" + P.salt; // new password => new salt => old saved keys are ignored
  const form = document.getElementById("f"), err = document.getElementById("err"), btn = document.getElementById("go");

  async function open(key){
    const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data); // throws on wrong key
    const html = new TextDecoder().decode(buf);
    // the app needs the same key to decrypt image packs on demand
    window.__BB_KEY = key;
    try {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      sessionStorage.setItem("banner-session-key", btoa(String.fromCharCode(...raw)));
    } catch(_){}
    document.open(); document.write(html); document.close();
  }
  async function derive(pw){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:P.iter, hash:"SHA-256"}, base,
      {name:"AES-GCM", length:256}, true, ["decrypt"]);
  }

  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
      await open(key); return;
    }
  } catch(e) { try { localStorage.removeItem(KEY); } catch(_){} }

  form.hidden = false;
  form.addEventListener("submit", async e => {
    e.preventDefault();
    err.textContent = ""; btn.disabled = true; btn.textContent = "Проверяю…";
    try {
      const key = await derive(document.getElementById("password").value);
      if (document.getElementById("remember").checked) {
        try {
          const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
          localStorage.setItem(KEY, btoa(String.fromCharCode(...raw)));
        } catch(_){}
      }
      await open(key);
    } catch(_) {
      err.textContent = "Неверный пароль. Попробуйте ещё раз.";
      btn.disabled = false; btn.textContent = "Войти";
    }
  });
})();
</script>
